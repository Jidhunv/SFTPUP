{% extends "base.html" %}
{% block body %}
<h1>Upload archive</h1>
<form method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="file" name="file" accept=".zip,.rar" required>
  <button>Upload</button>
</form>
{% if files %}
<table>
  <tr><th>File</th><th>Size</th></tr>
  {% for name, size in files %}<tr><td>{{ name }}</td><td>{{ (size / 1024)|round(1) }} KB</td></tr>{% endfor %}
</table>
{% endif %}
<form class="inline" method="post" action="{{ url_for('logout') }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <button>Sign out</button>
</form>
{% endblock %}
